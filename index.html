<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой профиль</title>
    <!-- Подключаем шрифт для красоты (опционально) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: #f5f7fa;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 16px;
        }

        .card {
            background: #ffffff;
            border-radius: 32px;
            padding: 40px 32px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 35px -8px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.02);
            transition: transform 0.2s ease;
        }

        .card:hover {
            transform: translateY(-4px);
        }

        .avatar {
            width: 140px;
            height: 140px;
            margin: 0 auto 24px;
            border-radius: 50%;
            background: linear-gradient(145deg, #3b82f6, #1e40af);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 12px 18px -6px rgba(37, 99, 235, 0.4);
            border: 4px solid #ffffff;
            outline: 3px solid #e0e7ff;
            overflow: hidden; /* если захотите вставить реальную картинку */
        }

        /* Стилизованная "аватарка" — если нет реального изображения */
        .avatar-inner {
            font-size: 60px;
            font-weight: 600;
            color: white;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
            letter-spacing: 2px;
        }

        /* Альтернативно: можно вставить img, но для простоты — буква */
        .avatar i {
            font-size: 64px;
            color: white;
        }

        h1 {
            font-size: 28px;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 8px;
            letter-spacing: -0.02em;
        }

        .tagline {
            font-size: 16px;
            color: #64748b;
            margin-bottom: 32px;
            font-weight: 400;
            padding: 0 8px;
        }

        .telegram-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            font-weight: 600;
            font-size: 18px;
            padding: 16px 36px;
            border-radius: 60px;
            transition: all 0.2s ease;
            box-shadow: 0 12px 20px -8px rgba(37, 99, 235, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
            letter-spacing: 0.3px;
            width: 100%;
            max-width: 300px;
            margin: 0 auto;
        }

        .telegram-btn:hover {
            background: #1d4ed8;
            transform: scale(1.02);
            box-shadow: 0 18px 28px -8px rgba(37, 99, 235, 0.7);
        }

        .telegram-btn:active {
            transform: scale(0.98);
        }

        .telegram-btn svg {
            width: 24px;
            height: 24px;
            fill: white;
            flex-shrink: 0;
        }

        .footer-note {
            margin-top: 28px;
            font-size: 13px;
            color: #94a3b8;
            opacity: 0.8;
        }

        /* Адаптивность для маленьких экранов */
        @media (max-width: 480px) {
            .card {
                padding: 32px 20px;
                border-radius: 28px;
            }
            .avatar {
                width: 120px;
                height: 120px;
            }
            .avatar-inner {
                font-size: 48px;
            }
            h1 {
                font-size: 24px;
            }
            .telegram-btn {
                font-size: 16px;
                padding: 14px 28px;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- Аватарка (можно заменить на <img> при необходимости) -->
        <div class="avatar">
            <!-- Круглая заглушка с инициалами или иконкой. 
                 Если хотите реальное фото, замените содержимое на <img src="avatar.jpg" alt="Аватар" style="width:100%;height:100%;object-fit:cover;"> -->
            <span class="avatar-inner">AI</span>

            <svg width="70" height="70" viewBox="0 0 24 24" fill="white">

            </svg>
            -->
        </div>

        <h1>YIFF furry cute girls NSFW</h1>
        <p class="tagline"> Yiff furry cute girls NSFW
Хентай по фурри </p>

        <!-- Синяя кнопка-ссылка на Telegram -->

            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M9.78 18.65l.28-4.23 7.68-6.92c.34-.31-.07-.46-.52-.19L7.74 13.3 3.64 12c-.88-.25-.89-.86.2-1.3l15.97-6.16c.73-.33 1.43.18 1.15 1.3l-2.72 12.81c-.19.91-.74 1.13-1.5.71L12.6 16.3l-1.99 1.93c-.23.23-.42.42-.83.42z"/>

    </div>
</body>
</html>
